[build]
  command = "npm run build:netlify"
  publish = "netlify-publish"

[build.environment]
  # Netlify's install step sets NODE_ENV=production, which makes npm skip
  # devDependencies — but tailwindcss/@tailwindcss/postcss (devDependencies)
  # are required by `next build` itself, so they must still be installed.
  NPM_FLAGS = "--include=dev"
  # Pin to a Node version known to support Next.js 16 / React 19 fully,
  # rather than relying on whatever Netlify's default image ships.
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  # The function's own JS has no static imports into ./standalone (it spawns
  # that server as a child process by file path at runtime), so esbuild's
  # dependency tracer can't discover those ~95MB / thousands of files on its
  # own — and letting it try anyway is what was breaking every build with a
  # generic exit code 4. node_bundler = "none" skips that tracing entirely.
  node_bundler = "none"

[functions."next-server"]
  # Ship the standalone server + its embedded node_modules verbatim,
  # bypassing static analysis (see node_bundler note above).
  included_files = ["netlify/functions/next-server/standalone/**"]
