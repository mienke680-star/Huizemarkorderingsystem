[build]
  command = "npm run build:netlify"
  publish = "netlify-publish"

[build.environment]
  # Netlify's install step sets NODE_ENV=production, which makes npm skip
  # devDependencies — but tailwindcss/@tailwindcss/postcss (devDependencies)
  # are required by `next build` itself, so they must still be installed.
  NPM_FLAGS = "--include=dev"
  # Pin to a Node version known to support Next.js 16 / React 19 fully,
  # rather than relying on whatever Netlify's default image ships.
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
